<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Epoch Status Checker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .status-dot {
            transition: background-color 0.3s ease-in-out;
        }
    </style>
</head>
<body class="bg-gray-900 text-white flex items-center justify-center min-h-screen">

    <div class="w-full max-w-md mx-auto p-4">
        <div class="bg-gray-800 rounded-2xl shadow-2xl p-8 text-center">
            
            <h1 class="text-3xl font-bold mb-2">Server Status</h1>
            <p class="text-gray-400 mb-6">Project: Epoch Login</p>

            <!-- Status Display -->
            <div id="status-card" class="bg-gray-700 rounded-lg p-6 mb-6 flex items-center justify-center space-x-4">
                <div id="status-dot" class="w-6 h-6 rounded-full bg-gray-500 status-dot animate-pulse"></div>
                <div>
                    <p class="text-xl font-semibold" id="status-text">Checking...</p>
                    <p class="text-xs text-gray-400">game.project-epoch.net:3724</p>
                </div>
            </div>

            <!-- Refresh Button -->
            <button id="refresh-btn" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-lg w-full transition-transform transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-opacity-50">
                Check Status Now
            </button>

            <!-- Last Checked Timestamp -->
            <p class="text-xs text-gray-500 mt-4" id="last-checked">Last checked: Never</p>
            
            <!-- Credit -->
            <p class="text-xs text-gray-600 mt-8">
                Generated with Gemini
            </p>

        </div>
    </div>

    <script>
        // --- DOM Elements ---
        const statusText = document.getElementById('status-text');
        const statusDot = document.getElementById('status-dot');
        const refreshBtn = document.getElementById('refresh-btn');
        const lastCheckedText = document.getElementById('last-checked');

        // --- Server Details ---
        const SERVER_HOST = 'Auth Server';
        const SERVER_PORT = 3724;
        
        // Using a reliable CORS proxy to prevent browser security errors.
        const originalApiUrl = `https://isportopen.com/api/v1/${SERVER_HOST}/${SERVER_PORT}`;
        const PROXY_API_URL = `https://api.allorigins.win/get?url=${encodeURIComponent(originalApiUrl)}`;


        /**
         * Checks the server status by calling a dedicated port-checking API via a CORS proxy.
         */
        async function checkServerStatus() {
            // 1. Update UI to "Checking" state
            statusText.textContent = 'Checking...';
            statusDot.classList.remove('bg-green-500', 'bg-red-500');
            statusDot.classList.add('bg-gray-500', 'animate-pulse');
            refreshBtn.disabled = true;
            refreshBtn.classList.add('opacity-50', 'cursor-not-allowed');

            try {
                // 2. Attempt the connection via the proxy API
                const response = await fetch(PROXY_API_URL);

                if (!response.ok) {
                    throw new Error(`CORS Proxy API returned an error: ${response.status} ${response.statusText}`);
                }
                
                const proxyData = await response.json();

                // 3. The actual API response is a JSON string inside the 'contents' property.
                // We must parse this nested JSON string to get the real data.
                if (!proxyData.contents) {
                    throw new Error("CORS Proxy response was empty or invalid.");
                }
                const actualData = JSON.parse(proxyData.contents);

                // 4. Set the server status based on the actual API's JSON response.
                setServerStatus(actualData.status === 'open');

            } catch (error) {
                // 5. If any part of the fetch or JSON parsing fails, assume it's offline.
                console.error("Server check failed:", error);
                setServerStatus(false);
            } finally {
                // 6. Re-enable the button and update the timestamp.
                refreshBtn.disabled = false;
                refreshBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                lastCheckedText.textContent = `Last checked: ${new Date().toLocaleTimeString()}`;
            }
        }

        /**
         * Updates the UI elements to reflect the server's status.
         * @param {boolean} isOnline - True if the server is considered online, false otherwise.
         */
        function setServerStatus(isOnline) {
            statusDot.classList.remove('animate-pulse');
            if (isOnline) {
                statusText.textContent = 'Online';
                statusDot.classList.remove('bg-gray-500', 'bg-red-500');
                statusDot.classList.add('bg-green-500');
            } else {
                statusText.textContent = 'Offline';
                statusDot.classList.remove('bg-gray-500', 'bg-green-500');
                statusDot.classList.add('bg-red-500');
            }
        }

        // --- Event Listeners ---
        refreshBtn.addEventListener('click', checkServerStatus);

        // --- Initial Check & Auto-Refresh ---
        window.addEventListener('load', () => {
            // Run the check immediately on load
            checkServerStatus(); 
            // And then set an interval to check again every 60 seconds (60,000 ms)
            setInterval(checkServerStatus, 60000); 
        });
    </script>

</body>
</html>
